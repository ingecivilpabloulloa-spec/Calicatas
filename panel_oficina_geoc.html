<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GEOC — Panel de Oficina</title>
<style>
:root{--v:#76892F;--vo:#5A6A1A;--vf:#EDF1E0;--vc:#C8D4A0;--tx:#1a1a1a;--gr:#666;--er:#A32D2D;--ok:#0F6E56}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:14px;background:#f0f0eb;color:var(--tx)}
.header{background:var(--vo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header img{height:32px;}
.header h1{font-size:18px;font-weight:500}
.header span{font-size:12px;opacity:.7;margin-left:auto}
.container{max-width:1200px;margin:0 auto;padding:20px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.toolbar select,.toolbar input{padding:8px 12px;border:0.5px solid #ddd;border-radius:8px;font-size:14px;background:#fff;min-width:200px}
.btn{padding:9px 18px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--vo);color:#fff}.btn-p:hover{background:var(--v)}
.btn-s{background:#fff;color:var(--vo);border:0.5px solid var(--vo)}.btn-s:hover{background:var(--vf)}
.btn-o{background:var(--vf);color:var(--vo);border:0.5px solid var(--v)}.btn-o:hover{background:var(--vc)}
.btn:disabled{background:#ccc;cursor:not-allowed;color:#888}
.card{background:#fff;border-radius:12px;border:0.5px solid #ddd;margin-bottom:16px;overflow:hidden}
.card-header{background:var(--vf);padding:12px 20px;border-bottom:0.5px solid var(--vc);display:flex;align-items:center;justify-content:space-between}
.card-header h2{font-size:15px;font-weight:600;color:var(--vo)}
.card-body{padding:16px 20px}
.proy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.proy-card{background:#fff;border:0.5px solid #ddd;border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s}
.proy-card:hover{border-color:var(--v);background:var(--vf)}
.proy-card h3{font-size:14px;font-weight:600;color:var(--vo);margin-bottom:4px}
.proy-card p{font-size:12px;color:var(--gr)}
.proy-card .badge{display:inline-block;background:var(--vf);color:var(--vo);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:6px}
.cal-table{width:100%;border-collapse:collapse}
.cal-table th{background:var(--v);color:#fff;padding:9px 12px;text-align:left;font-size:13px;font-weight:500}
.cal-table td{padding:9px 12px;border-bottom:0.5px solid #f0f0f0;font-size:13px;vertical-align:middle}
.cal-table tr:last-child td{border-bottom:none}
.cal-table tr:hover td{background:var(--vf)}
.cal-table input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--v)}
.status{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600}
.status-ok{background:#E1F5EE;color:var(--ok)}
.loading{text-align:center;padding:40px;color:var(--gr)}
.loading .spinner{width:36px;height:36px;border:3px solid var(--vc);border-top-color:var(--v);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--gr)}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}.toast.ok{background:var(--ok)}.toast.err{background:var(--er)}
.back-btn{background:none;border:none;color:var(--vo);font-size:14px;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;margin-bottom:16px}
.back-btn:hover{text-decoration:underline}
.sel-all-row{padding:8px 12px;background:var(--vf);border-bottom:0.5px solid var(--vc);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--vo)}
.acciones-bar{background:var(--vo);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;border-radius:0 0 10px 10px;font-size:13px}
.acciones-bar.hidden{display:none}
#pdf-container .pp{display:none}
@media print{
  body{background:white;margin:0;padding:0}
  .header,.container{display:none!important}
  #pdf-container{display:block!important}
  #pdf-container .pp{display:flex!important;width:210mm;height:297mm;padding:8mm 8mm 6mm 8mm;background:white;flex-direction:column;page-break-after:always;box-sizing:border-box}
  #pdf-container .pp:last-child{page-break-after:avoid}
}
</style>
</head>
<body>
<div class="header">
  <img src="./geoc_logo.png" alt="GEOC">
  <h1>Panel de Oficina</h1>
  <span id="hdr-info">Conectando al Sheet...</span>
</div>

<div class="container">
  <!-- VISTA: PROYECTOS -->
  <div id="vista-proyectos">
    <div class="toolbar">
      <input type="text" id="buscador" placeholder="🔍 Buscar proyecto..." oninput="filtrarProyectos()">
      <button class="btn btn-p" onclick="cargarDatos()">↻ Actualizar</button>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>Proyectos</h2>
        <span id="total-proy" style="font-size:12px;color:var(--gr)"></span>
      </div>
      <div class="card-body">
        <div id="proy-container" class="loading">
          <div class="spinner"></div>
          <div>Cargando datos desde el Sheet...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- VISTA: CALICATAS DE UN PROYECTO -->
  <div id="vista-calicatas" style="display:none">
    <button class="back-btn" onclick="volverProyectos()">← Volver a proyectos</button>
    <div class="card">
      <div class="card-header">
        <h2 id="proy-titulo">Proyecto</h2>
        <div style="display:flex;gap:8px">
          <button class="btn btn-o" onclick="selAll()">☑ Seleccionar todas</button>
          <button class="btn btn-p" onclick="expSeleccionadas()">📄 Exportar seleccionadas</button>
          <button class="btn btn-p" onclick="expTodas()">📄 Exportar proyecto completo</button>
        </div>
      </div>
      <div class="sel-all-row">
        <input type="checkbox" id="chk-all" onchange="toggleAll(this)">
        <label for="chk-all">Seleccionar todas las calicatas</label>
        <span id="sel-count" style="margin-left:auto"></span>
      </div>
      <table class="cal-table">
        <thead>
          <tr>
            <th style="width:40px"></th>
            <th>Calicata</th>
            <th>Fecha</th>
            <th>Prof. Total</th>
            <th>Horizontes</th>
            <th>UTM</th>
            <th>Condición</th>
            <th style="width:80px">PDF</th>
            <th style="width:80px">Editar</th>
          </tr>
        </thead>
        <tbody id="cal-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="pdf-container"></div>

<!-- MODAL EDICIÓN -->
<div id="modal-edit" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto">
  <div style="background:#fff;max-width:860px;margin:40px auto;border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div style="background:var(--vo);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between">
      <h2 id="modal-titulo" style="font-size:16px;font-weight:600"></h2>
      <button onclick="cerrarModal()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1">×</button>
    </div>
    <div style="padding:20px 24px">
      <!-- Datos generales -->
      <div style="background:var(--vf);border-radius:8px;padding:14px;margin-bottom:16px">
        <div style="font-weight:600;color:var(--vo);margin-bottom:10px;font-size:13px">📋 DATOS GENERALES</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
          <label style="font-size:12px;color:var(--gr)">Fecha<input id="ed-fecha" type="date" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px"></label>
          <label style="font-size:12px;color:var(--gr)">Prof. Total (m)<input id="ed-pt" type="text" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px"></label>
          <label style="font-size:12px;color:var(--gr)">Condición Meteorológica<input id="ed-met" type="text" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px"></label>
          <label style="font-size:12px;color:var(--gr)">Nivel Freático (m)<input id="ed-nf" type="text" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px"></label>
          <label style="font-size:12px;color:var(--gr)">Obs. Nivel Freático<input id="ed-nfobs" type="text" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px"></label>
          <label style="font-size:12px;color:var(--gr)">Obs. Generales<input id="ed-obs" type="text" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px"></label>
        </div>
      </div>
      <!-- Horizontes -->
      <div id="ed-horizontes"></div>
    </div>
    <div style="padding:12px 24px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:0.5px solid #eee">
      <button class="btn btn-s" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-p" id="btn-guardar" onclick="guardarEdicion()">💾 Guardar en Sheet</button>
    </div>
  </div>
</div>

<script>
const SU = 'https://script.google.com/macros/s/AKfycbw4QQ2FRVdKzB5Z8Ky3K-9vz9BpMUR6FXUKpYe8rAbJPbd1eL5NS73lSxGFbiObglHDLg/exec';
const LOGO = './geoc_logo.png';
const V='#76892F', VO='#5A6A1A', VF='#EDF1E0', VC='#C8D4A0';
const UM = {'GW':'Grava bien graduada','GP':'Grava mal graduada','GM':'Grava limosa','GC':'Grava arcillosa','GW-GM':'Grava b.grad. c/ limo','GW-GC':'Grava b.grad. c/ arcilla','GP-GM':'Grava m.grad. c/ limo','GP-GC':'Grava m.grad. c/ arcilla','SW':'Arena bien graduada','SP':'Arena mal graduada','SM':'Arena limosa','SC':'Arena arcillosa','SW-SM':'Arena b.grad. c/ limo','SW-SC':'Arena b.grad. c/ arcilla','SP-SM':'Arena m.grad. c/ limo','SP-SC':'Arena m.grad. c/ arcilla','ML':'Limo baja plast.','CL':'Arcilla baja-media plast.','OL':'Limo/arcilla org. baja','MH':'Limo alta plast.','CH':'Arcilla alta plast.','OH':'Arcilla/limo org. alta','PT':'Turba/orgánico','ROCA-SED':'Roca sedimentaria','ROCA-IGN':'Roca ígnea','ROCA-MET':'Roca metamórfica','RELL-C':'Relleno controlado','RELL-CONT':'Relleno contaminado','COB-VEG':'Cobertura vegetal','OTRO':'Otro'};

let todosProyectos = {};
let proyectoActual = null;
let calicatasActuales = {};

// ── CARGAR DATOS ──
async function cargarDatos() {
  document.getElementById('proy-container').innerHTML = '<div class="loading"><div class="spinner"></div><div>Cargando datos...</div></div>';
  document.getElementById('hdr-info').textContent = 'Cargando...';
  try {
    const resp = await fetch(SU);
    const json = await resp.json();
    procesarDatos(json.data || []);
  } catch(e) {
    document.getElementById('proy-container').innerHTML = '<div class="empty">⚠ Error al conectar con el Sheet.<br>Verifica que el Apps Script esté publicado correctamente.</div>';
    document.getElementById('hdr-info').textContent = 'Error de conexión';
    toast('Error al cargar datos','err');
  }
}

function getCol(row, ...keys) {
  for(const k of keys) {
    if(row[k] !== undefined && row[k] !== '') return row[k];
  }
  return '';
}

function procesarDatos(rows) {
  todosProyectos = {};
  // Diagnóstico: mostrar columnas de la primera fila
  if(rows.length > 0) {
    console.log('Columnas disponibles:', Object.keys(rows[0]));
    console.log('Primera fila:', rows[0]);
  }
  rows.forEach(row => {
    const proy = row['Proyecto'] || '';
    const calId = row['ID Calicata'] || '';
    const uid = getCol(row,'CalicataUID') || (proy+'_'+calId);
    // Buscar columna horizonte de forma robusta (case-insensitive)
    const nHorKey = Object.keys(row).find(k => k.toLowerCase().replace(/[^a-z]/g,'').includes('horizonte'));
    const nHor = String(parseInt((nHorKey ? row[nHorKey] : null) || '1'));
    if(!proy) return;
    if(!todosProyectos[proy]) {
      todosProyectos[proy] = {
        nombre: proy,
        cod: row['Código Proyecto'] || '',
        ot: row['OT N°'] || '',
        calicatas: {}
      };
    }
    const p = todosProyectos[proy];
    if(!p.calicatas[calId]) {
      p.calicatas[calId] = {
        id: calId,
        uid: uid,
        fecha: row['Fecha'] || '',
        pt: row['Prof. Total (m)'] || '',
        met: row['Condición Meteorológica'] || '',
        nf: row['Nivel Freático (m)'] || '',
        nfobs: row['Obs. Nivel Freático'] || '',
        lat: row['Latitud'] || '',
        lng: row['Longitud'] || '',
        utme: row['UTM Este'] || '',
        utmn: row['UTM Norte'] || '',
        zona: row['UTM Zona'] || '',
        obs: row['Obs. Generales'] || '',
        hs: []
      };
    }
    // Agregar horizonte
    const cal = p.calicatas[calId];
    // Evitar duplicados de horizonte
    if(!cal.hs.find(h=>parseInt(h.n)===parseInt(nHor))) {
      console.log('Agregando H'+nHor+' a '+calId+', total actual:', cal.hs.length);
      cal.hs.push({
        n: parseInt(nHor),
        ini: row['Prof. Inicio (m)'] || '',
        fin: row['Prof. Fin (m)'] || '',
        pBol: row['% Bolones'] || '',
        tBol: row['Tmáx Bolones'] || '',
        pG: row['% Gravas'] || '',
        pA: row['% Arenas'] || '',
        pF: row['% Finos'] || '',
        tP: row['Tmáx Partículas'] || '',
        tPr: row['T Predominante'] || '',
        gq: row['Graduación'] || '',
        us: row['Símbolo USCS'] || '',
        ns: row['Nombre Suelo'] || '',
        nl: row['Nombre Local'] || '',
        cP: row['Color Principal'] || '',
        cS: row['Color Secundario'] || '',
        ma: row['Manchas/Bandas'] || '',
        ol: row['Olor'] || '',
        di: row['Dilatancia'] || '',
        rs: row['Resistencia Seca'] || '',
        pl: row['Plasticidad'] || '',
        fo: row['Forma Partículas'] || '',
        hu: row['Humedad'] || '',
        co: row['Compacidad'] || '',
        cn: row['Consistencia'] || '',
        st: row['Estructura'] || '',
        ce: row['Cementación'] || '',
        or: row['Origen'] || '',
        mo: row['Materia Orgánica'] || '',
        ms: row['Tipo Muestra'] ? row['Tipo Muestra'].split(' | ').map((t,i)=>{
          const cotas = (row['Cota Muestra']||'').split(' | ');
          const ensayos = (row['Ensayo']||'').split(' | ');
          return {t, co:cotas[i]||'', e:ensayos[i]||''};
        }) : [],
        obs: row['Obs. Horizonte'] || ''
      });
    }
  });
  // Ordenar horizontes
  Object.values(todosProyectos).forEach(p => {
    Object.values(p.calicatas).forEach(cal => {
      cal.hs.sort((a,b)=>parseInt(a.n)-parseInt(b.n));
    });
  });
  const nProy = Object.keys(todosProyectos).length;
  const nCals = Object.values(todosProyectos).reduce((s,p)=>s+Object.keys(p.calicatas).length,0);
  document.getElementById('hdr-info').textContent = `${nProy} proyectos · ${nCals} calicatas`;
  document.getElementById('total-proy').textContent = `${nProy} proyectos · ${nCals} calicatas totales`;
  renderProyectos();
  toast('Datos cargados ✓','ok');
}

function filtrarProyectos() {
  const q = document.getElementById('buscador').value.toLowerCase();
  document.querySelectorAll('.proy-card').forEach(c => {
    c.style.display = c.dataset.nombre.toLowerCase().includes(q) ? '' : 'none';
  });
}

function renderProyectos() {
  const cont = document.getElementById('proy-container');
  const proys = Object.values(todosProyectos);
  if(!proys.length) { cont.innerHTML='<div class="empty">No hay datos en el Sheet aún.</div>'; return; }
  cont.innerHTML = '';
  const grid = document.createElement('div'); grid.className='proy-grid';
  proys.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(p => {
    const nCals = Object.keys(p.calicatas).length;
    const d = document.createElement('div'); d.className='proy-card'; d.dataset.nombre=p.nombre;
    d.onclick = ()=>abrirProyecto(p.nombre);
    d.innerHTML=`<h3>${p.nombre}</h3><p>OT ${p.ot} · ${p.cod}</p><span class="badge">${nCals} calicata${nCals!==1?'s':''}</span>`;
    grid.appendChild(d);
  });
  cont.appendChild(grid);
}

function abrirProyecto(nombre) {
  proyectoActual = todosProyectos[nombre];
  calicatasActuales = proyectoActual.calicatas;
  document.getElementById('proy-titulo').textContent = `${proyectoActual.nombre} — OT ${proyectoActual.ot}`;
  document.getElementById('vista-proyectos').style.display='none';
  document.getElementById('vista-calicatas').style.display='block';
  renderCalicatas();
}

function volverProyectos() {
  document.getElementById('vista-calicatas').style.display='none';
  document.getElementById('vista-proyectos').style.display='block';
}

function renderCalicatas() {
  const tbody = document.getElementById('cal-tbody');
  tbody.innerHTML='';
  const cals = Object.values(calicatasActuales).sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  if(!cals.length) { tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--gr)">Sin calicatas</td></tr>'; return; }
  cals.forEach(cal => {
    const tr=document.createElement('tr');
    const utmStr = cal.utme&&cal.utmn ? `E ${parseInt(cal.utme).toLocaleString()} / N ${parseInt(cal.utmn).toLocaleString()}` : '—';
    tr.innerHTML=`
      <td><input type="checkbox" class="chk-cal" data-id="${cal.id}" onchange="updSelCount()"></td>
      <td style="font-weight:600;color:var(--vo)">${cal.id}</td>
      <td>${cal.fecha||'—'}</td>
      <td>${cal.pt||'—'} m</td>
      <td>${cal.hs.length} horizonte${cal.hs.length!==1?'s':''}</td>
      <td style="font-size:12px;color:var(--gr)">${utmStr}</td>
      <td>${cal.met||'—'}</td>
      <td><button class="btn btn-o" style="padding:5px 10px;font-size:12px" onclick="expCalicata('${cal.id}')">📄 PDF</button></td>
      <td><button class="btn btn-s" style="padding:5px 10px;font-size:12px" onclick="abrirEdicion('${cal.id}')">✏️ Editar</button></td>`;
    tbody.appendChild(tr);
  });
  updSelCount();
}

function selAll() {
  document.querySelectorAll('.chk-cal').forEach(c=>c.checked=true);
  document.getElementById('chk-all').checked=true;
  updSelCount();
}
function toggleAll(chk) {
  document.querySelectorAll('.chk-cal').forEach(c=>c.checked=chk.checked);
  updSelCount();
}
function updSelCount() {
  const n = document.querySelectorAll('.chk-cal:checked').length;
  document.getElementById('sel-count').textContent = n>0 ? `${n} seleccionada${n!==1?'s':''}` : '';
}

function expCalicata(id) {
  // Buscar por id explícitamente (evita problema con keys numéricas)
  const cal = Object.values(calicatasActuales).find(c=>c.id===id);
  if(!cal) return;
  bldPDF(proyectoActual, cal);
}

function expSeleccionadas() {
  const ids = Array.from(document.querySelectorAll('.chk-cal:checked')).map(c=>c.dataset.id);
  if(!ids.length) { toast('Selecciona al menos una calicata','err'); return; }
  bldPDFMultiple(proyectoActual, ids.map(id=>Object.values(calicatasActuales).find(c=>c.id===id)).filter(Boolean));
}

function expTodas() {
  const cals = Object.values(calicatasActuales).sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  if(!cals.length) { toast('No hay calicatas','err'); return; }
  bldPDFMultiple(proyectoActual, cals);
}

// ── GENERADOR PDF ──
function bldPDF(pr, cal) {
  const cont = document.getElementById('pdf-container'); cont.innerHTML='';
  bldPDFPages(pr, cal, cont);
  imprimir(`${pr.nombre.replace(/\s+/g,'_')}_${cal.id}`);
}

function bldPDFMultiple(pr, cals) {
  const cont = document.getElementById('pdf-container'); cont.innerHTML='';
  cals.forEach(cal => bldPDFPages(pr, cal, cont));
  imprimir(`${pr.nombre.replace(/\s+/g,'_')}_Completo`);
}

function imprimir(nombre) {
  const old = document.title; document.title = nombre;
  // Mostrar páginas PDF y ocultar interfaz
  document.querySelectorAll('#pdf-container .pp').forEach(p=>p.style.display='flex');
  document.querySelector('.header').style.display='none';
  document.querySelector('.container').style.display='none';
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{
      // Restaurar interfaz
      document.querySelectorAll('#pdf-container .pp').forEach(p=>p.style.display='none');
      document.getElementById('pdf-container').innerHTML='';
      document.querySelector('.header').style.display='';
      document.querySelector('.container').style.display='';
      document.title=old;
    },500);
  },200);
}

function bldPDFPages(pr, cal, cont) {
  const HPAG=6, hs=cal.hs||[];
  const pages=[]; for(let i=0;i<Math.max(1,hs.length);i+=HPAG) pages.push(hs.slice(i,i+HPAG));
  const nP=pages.length;
  const tms=[]; hs.forEach(h=>{(h.ms||[]).forEach(m=>tms.push({h:`H-${h.n}`,co:m.co,t:m.t,e:m.e}))}); tms.sort((a,b)=>parseFloat(a.co)-parseFloat(b.co));
  const th=t=>`<th style="background:${V};color:white;border:0.5px solid ${VO};padding:2px;font-size:7px;text-align:center">${t}</th>`;
  const td=v=>`<td style="border:0.5px solid #ccc;padding:1.5px 2px;font-size:7px;text-align:center">${v||'—'}</td>`;
  const rl=l=>`<td style="border:0.5px solid #ccc;padding:1.5px 3px;font-size:6.5px;text-align:left;background:${VF};font-weight:bold;color:${VO};width:30mm">${l}</td>`;
  const rs=l=>`<td style="border:0.5px solid #ccc;padding:1.5px 7px;font-size:6.5px;text-align:left;background:#F7F9F0;width:30mm;color:#444">${l}</td>`;
  const sr=l=>`<tr><td colspan="7" style="background:${VC};font-weight:bold;font-size:6.5px;text-align:left;padding:1.5px 3px;color:${VO};border:0.5px solid ${V}">▸ ${l}</td></tr>`;
  const tblE=phz=>{
    const hc=Array.from({length:6},(_,i)=>phz[i]||null);
    const rw=(lbl,fn,isL=true)=>`<tr>${isL?rl(lbl):rs(lbl)}${hc.map(h=>td(h?fn(h):'')).join('')}</tr>`;
    return `<table style="width:100%;border-collapse:collapse"><thead><tr>${th('Parámetro')}${hc.map(h=>th(h?'H-'+h.n:'')).join('')}</tr></thead><tbody>
    ${rw('Desde (m)',h=>h.ini)}${rw('Hasta (m)',h=>h.fin)}${rw('Espesor (m)',h=>h.ini&&h.fin?(parseFloat(h.fin)-parseFloat(h.ini)).toFixed(2):'')}
    ${sr('Granulometría Estimada')}${rw('Bolones % (>3")',h=>h.pBol?h.pBol+'%':'',false)}${rw('Tmáx Bolones',h=>h.tBol,false)}${rw('Tmáx Partículas',h=>h.tP,false)}${rw('T Predominante',h=>h.tPr,false)}${rw('Graduación',h=>h.gq,false)}${rw('Gravas %',h=>h.pG?h.pG+'%':'',false)}${rw('Arenas %',h=>h.pA?h.pA+'%':'',false)}${rw('Finos %',h=>h.pF?h.pF+'%':'',false)}
    ${sr('Clasificación')}${rw('Símbolo USCS',h=>h.us)}${rw('Nombre del Suelo',h=>h.ns||UM[h.us]||'')}${rw('Nombre Local',h=>h.nl)}
    ${sr('Descripción')}${rw('Color Principal',h=>h.cP)}${rw('Color Secundario',h=>h.cS)}${rw('Manchas/Bandas',h=>h.ma)}${rw('Olor',h=>h.ol)}${rw('Dilatancia',h=>h.di)}${rw('Resistencia Seca',h=>h.rs)}${rw('Plasticidad',h=>h.pl)}${rw('Forma Partícula',h=>h.fo)}${rw('Humedad',h=>h.hu)}${rw('Consist./Compac.',h=>h.cn||h.co)}${rw('Estructura',h=>h.st)}${rw('Cementación',h=>h.ce)}${rw('Origen',h=>h.or)}${rw('Materia Orgánica',h=>h.mo)}
    </tbody></table>`;
  };
  const sec=(tit,body)=>`<div style="border:1px solid ${V};margin-bottom:3px"><div style="background:${V};color:white;font-weight:bold;font-size:8.5px;padding:2px 5px;text-transform:uppercase">${tit}</div>${body}</div>`;
  const fFull=(l,v,ex='')=>`<div style="display:flex;border-bottom:0.5px solid #ddd;min-height:12px"><div style="width:46mm;padding:2px 4px;font-weight:bold;color:${VO};font-size:7.5px;border-right:0.5px solid #ddd;background:${VF};display:flex;align-items:center">${l}</div><div style="flex:1;padding:2px 4px;font-size:8px;display:flex;align-items:center">${v}</div>${ex}</div>`;
  const f2=(l1,v1,l2,v2)=>`<div style="display:grid;grid-template-columns:1fr 1fr">${fI(l1,v1)}${fI(l2,v2)}</div>`;
  const fI=(l,v)=>`<div style="display:flex;border-bottom:0.5px solid #ddd;border-right:0.5px solid #eee;min-height:12px"><div style="width:46mm;padding:2px 4px;font-weight:bold;color:${VO};font-size:7.5px;border-right:0.5px solid #ddd;background:${VF};display:flex;align-items:center">${l}</div><div style="flex:1;padding:2px 4px;font-size:8px;display:flex;align-items:center">${v}</div></div>`;
  pages.forEach((phz,pi)=>{
    const isF=pi===0, isL=pi===pages.length-1;
    const pg=document.createElement('div'); pg.className='pp'; let h='';
    if(isF){
      h+=`<div style="display:flex;border:1.5px solid ${VO};margin-bottom:3px"><div style="width:38mm;border-right:1px solid ${VO};padding:4px 6px;display:flex;align-items:center;justify-content:center"><img src="${LOGO}" style="width:100%;max-width:34mm"></div><div style="flex:1;border-right:1px solid ${VO};padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:11px;font-weight:bold;text-align:center;text-transform:uppercase;color:${VO}">Estratigrafía de Suelos</div><div style="font-size:7.5px;text-align:center;color:#666;margin-top:2px">Según Manual de Carreteras, Volumen 2, Tabla 2.503.202(3) A y B</div><div style="font-size:7.5px;text-align:center;color:#666">Sistema de Gestión de Calidad GEOC Laboratorio</div></div><div style="width:34mm;padding:4px 5px;background:${VF};display:flex;flex-direction:column;gap:3px;justify-content:center"><div style="display:flex;justify-content:space-between;font-size:7.5px"><span style="color:#666">Código</span><span style="font-weight:bold;color:${VO}">FM04</span></div><div style="display:flex;justify-content:space-between;font-size:7.5px"><span style="color:#666">Versión</span><span style="font-weight:bold;color:${VO}">1</span></div><div style="display:flex;justify-content:space-between;font-size:7.5px"><span style="color:#666">Fecha</span><span style="font-weight:bold;color:${VO}">08-10-2025</span></div><div style="display:flex;justify-content:space-between;font-size:7.5px"><span style="color:#666">Página</span><span style="font-weight:bold;color:${VO}">${pi+1} de ${nP}</span></div></div></div>`;
      h+=sec('I. Antecedentes Generales',fFull('Nombre del Proyecto u Obra',`<b>${pr.nombre}</b>`,`<div style="border-left:1px solid ${V};padding:2px 6px;background:${VF};text-align:center;width:22mm;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:7px;color:#666;font-weight:bold">OT N°</div><div style="font-size:15px;font-weight:bold;color:${VO}">${pr.ot}</div></div>`)+fFull('Código Proyecto',pr.cod||''));
      h+=sec('III. Identificación de la Muestra',`<div style="display:grid;grid-template-columns:1fr 1fr 1fr">${fI('Calicata N°',`<b>${cal.id}</b>`)}${fI('Fecha de Muestreo',cal.fecha||'')}${fI('Prof. Total',`<b>${cal.pt||''} m</b>`)}</div><div style="display:grid;grid-template-columns:2fr 1fr">${fI('Ubicación UTM ('+(cal.zona||'19S')+')',cal.utme?`E: ${parseInt(cal.utme).toLocaleString()} m &nbsp;|&nbsp; N: ${parseInt(cal.utmn).toLocaleString()} m`:'')}${fI('Condición Meteorológica',cal.met||'')}</div><div style="display:grid;grid-template-columns:1fr 2fr">${fI('Prof. Nivel Freático',(cal.nf||'No detectado')+(cal.nf?' m':''))}${fI('Obs. Nivel Freático',cal.nfobs||'')}</div>`);
    }else{
      h+=`<div style="display:flex;border:1.5px solid ${VO};margin-bottom:3px;background:${VF};padding:3px 6px;align-items:center;justify-content:space-between"><img src="${LOGO}" style="height:10mm"><div style="flex:1;padding:0 8px"><div style="font-size:8.5px;font-weight:bold;color:${VO}">${pr.nombre} (${pr.cod})</div><div style="font-size:7.5px;color:#666">Estratigrafía de Suelos — MC Vol.2 Tabla 2.503.202(3) A y B</div></div><div style="display:flex;gap:8px;font-size:7.5px"><div><span style="color:#666">Calicata: </span><b style="color:${VO}">${cal.id}</b></div><div><span style="color:#666">OT: </span><b style="color:${VO}">${pr.ot}</b></div><div><span style="color:#666">Pág: </span><b style="color:${VO}">${pi+1} de ${nP}</b></div></div></div>`;
    }
    const hr=phz.length?`(${phz[0].n}–${phz[phz.length-1].n})`:'';
    h+=`<div style="border:1px solid ${V};margin-bottom:3px"><div style="background:${V};color:white;font-weight:bold;font-size:8.5px;padding:2px 5px;text-transform:uppercase">IV. Descripción Visual de Horizontes ${nP>1?hr:''}</div>${tblE(phz)}</div>`;
    if(isL){
      h+=`<div style="border:1px solid ${V};margin-bottom:3px"><div style="background:${V};color:white;font-weight:bold;font-size:8.5px;padding:2px 5px;text-transform:uppercase">V. Resumen de Muestras</div><table style="width:100%;border-collapse:collapse"><thead><tr>${['Horizonte','Cota (m)','Tipo','Ensayo'].map(t=>`<th style="background:${V};color:white;font-size:7.5px;padding:2px 4px;border:0.5px solid ${VO};text-align:center">${t}</th>`).join('')}</tr></thead><tbody>${tms.length?tms.map((m,mi)=>`<tr>${[m.h,m.co,m.t,m.e].map(v=>`<td style="font-size:7.5px;padding:2px 4px;border:0.5px solid #ccc;text-align:center;background:${mi%2?VF:'white'}">${v||''}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="4" style="text-align:center;font-size:7.5px;padding:4px;color:#888">Sin muestras</td></tr>'}</tbody></table></div>`;
      h+=`<div style="border:1px solid ${V};margin-bottom:3px"><div style="background:${V};color:white;font-weight:bold;font-size:8.5px;padding:2px 5px;text-transform:uppercase">VI. Observaciones Generales</div><div style="padding:3px 5px;font-size:8px;min-height:12mm">${cal.obs||''}</div></div>`;
    }
    h+='<div style="flex:1"></div>';
    if(isL){
      h+=`<div><div style="display:grid;grid-template-columns:1fr 1fr;gap:15mm;margin-top:5mm">${['Encargado de Muestreo','Recepción GEOC Laboratorio'].map(l=>`<div style="text-align:center"><div style="height:14mm"></div><div style="border-top:1px solid ${VO};margin-bottom:2px"></div><div style="font-size:7.5px;font-weight:bold;color:${VO}">Nombre y Firma</div><div style="font-size:7px;color:#666">${l}</div></div>`).join('')}</div></div>`;
    }
    h+=`<div style="text-align:center;font-size:7px;color:#666;margin-top:4mm;border-top:1px solid ${VC};padding-top:2px">Calle Francia N°188, Temuco. E-mail: contacto@geoc.cl — FM04 v1 — Página ${pi+1} de ${nP}</div>`;
    pg.innerHTML=h; cont.appendChild(pg);
  });
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2800);
}

// ── MODAL EDICIÓN ──────────────────────────────────────────────
let calEditando = null;

function abrirEdicion(id) {
  const cal = Object.values(calicatasActuales).find(c => c.id === id);
  if (!cal) { toast('Calicata no encontrada','err'); return; }
  calEditando = cal;

  // Datos generales
  document.getElementById('modal-titulo').textContent = `Editando Calicata ${cal.id} — ${proyectoActual.nombre}`;
  document.getElementById('ed-fecha').value = cal.fecha || '';
  document.getElementById('ed-pt').value = cal.pt || '';
  document.getElementById('ed-met').value = cal.met || '';
  document.getElementById('ed-nf').value = cal.nf || '';
  document.getElementById('ed-nfobs').value = cal.nfobs || '';
  document.getElementById('ed-obs').value = cal.obs || '';

  renderHorizontesEdit(cal);
  document.getElementById('modal-edit').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function cerrarModal() {
  document.getElementById('modal-edit').style.display = 'none';
  document.body.style.overflow = '';
  calEditando = null;
}

function renderHorizontesEdit(cal) {
  const cont = document.getElementById('ed-horizontes');
  if (!cal.hs || !cal.hs.length) { cont.innerHTML = '<p style="color:var(--gr);font-size:13px">Sin horizontes registrados.</p>'; return; }

  const inp = (id,lbl,val,tipo='text') =>
    `<label style="font-size:12px;color:var(--gr)">${lbl}<input id="${id}" type="${tipo}" value="${val||''}" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px"></label>`;

  const sel = (id,lbl,val,opts) =>
    `<label style="font-size:12px;color:var(--gr)">${lbl}<select id="${id}" style="display:block;width:100%;margin-top:3px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-size:13px">${opts.map(o=>`<option value="${o}"${o===val?' selected':''}>${o||'—'}</option>`).join('')}</select></label>`;

  const SUCS_OPTS = [''].concat(Object.keys(UM));
  const OPTS_SI = ['','Sí','No'];
  const OPTS_HUM = ['','Seco','Húmedo','Saturado','Muy húmedo'];
  const OPTS_COM = ['','Muy suelto','Suelto','Medianamente denso','Denso','Muy denso'];
  const OPTS_CON = ['','Muy blanda','Blanda','Firme','Muy firme','Dura'];
  const OPTS_GR  = ['','Bien graduada','Mal graduada','Uniforme'];
  const OPTS_DI  = ['','Alta','Baja','Nula'];
  const OPTS_RS  = ['','Alta','Media','Baja','Nula'];
  const OPTS_PL  = ['','Alta','Media','Baja','No plástico'];
  const OPTS_FO  = ['','Angular','Subangular','Subredondeada','Redondeada'];
  const OPTS_CE  = ['','Calcárea','Silícea','Arcillosa','Ninguna'];
  const OPTS_OR  = ['','Aluvial','Coluvial','Eólico','Glacial','Marino','Lacustre','Volcánico','Antrópico','Otro'];
  const OPTS_MO  = ['','Ausente','Trazas','Moderada','Abundante'];
  const OPTS_TM  = ['','Alterada','Inalterada','Muestra de agua'];
  const OPTS_ENS = ['','Granulometría','Límites de Atterberg','Humedad natural','CBR','Proctor','Densidad in situ','Clasificación USCS','Otro'];

  cont.innerHTML = cal.hs.map((h, hi) => `
    <div style="background:var(--vf);border-radius:8px;padding:14px;margin-bottom:12px;border:0.5px solid var(--vc)">
      <div style="font-weight:600;color:var(--vo);margin-bottom:10px;font-size:13px">🪨 HORIZONTE ${h.n}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">
        ${inp(`eh${hi}_ini`,'Prof. Inicio (m)',h.ini)}
        ${inp(`eh${hi}_fin`,'Prof. Fin (m)',h.fin)}
        ${sel(`eh${hi}_us`,'Símbolo USCS',h.us,SUCS_OPTS)}
        ${inp(`eh${hi}_ns`,'Nombre Suelo',h.ns)}
        ${inp(`eh${hi}_nl`,'Nombre Local',h.nl)}
        ${inp(`eh${hi}_cP`,'Color Principal',h.cP)}
        ${inp(`eh${hi}_cS`,'Color Secundario',h.cS)}
        ${inp(`eh${hi}_ma`,'Manchas/Bandas',h.ma)}
        ${inp(`eh${hi}_pBol`,'% Bolones',h.pBol)}
        ${inp(`eh${hi}_tBol`,'Tmáx Bolones',h.tBol)}
        ${inp(`eh${hi}_pG`,'% Gravas',h.pG)}
        ${inp(`eh${hi}_pA`,'% Arenas',h.pA)}
        ${inp(`eh${hi}_pF`,'% Finos',h.pF)}
        ${inp(`eh${hi}_tP`,'Tmáx Partículas',h.tP)}
        ${inp(`eh${hi}_tPr`,'T Predominante',h.tPr)}
        ${sel(`eh${hi}_gq`,'Graduación',h.gq,OPTS_GR)}
        ${sel(`eh${hi}_hu`,'Humedad',h.hu,OPTS_HUM)}
        ${sel(`eh${hi}_co`,'Compacidad',h.co,OPTS_COM)}
        ${sel(`eh${hi}_cn`,'Consistencia',h.cn,OPTS_CON)}
        ${sel(`eh${hi}_di`,'Dilatancia',h.di,OPTS_DI)}
        ${sel(`eh${hi}_rs`,'Resistencia Seca',h.rs,OPTS_RS)}
        ${sel(`eh${hi}_pl`,'Plasticidad',h.pl,OPTS_PL)}
        ${sel(`eh${hi}_fo`,'Forma Partículas',h.fo,OPTS_FO)}
        ${inp(`eh${hi}_ol`,'Olor',h.ol)}
        ${sel(`eh${hi}_ce`,'Cementación',h.ce,OPTS_CE)}
        ${sel(`eh${hi}_or`,'Origen',h.or,OPTS_OR)}
        ${sel(`eh${hi}_mo`,'Materia Orgánica',h.mo,OPTS_MO)}
        ${inp(`eh${hi}_st`,'Estructura',h.st)}
      </div>
      <div style="display:grid;grid-template-columns:1fr;gap:10px">
        ${inp(`eh${hi}_obs`,'Obs. Horizonte',h.obs)}
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--gr);font-weight:600;margin-bottom:6px">Muestras</div>
      ${(h.ms||[]).map((m,mi)=>`
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px;background:#fff;border-radius:6px;padding:8px;border:0.5px solid #ddd">
          <div style="font-size:11px;color:var(--vo);font-weight:600;grid-column:1/-1">Muestra ${mi+1}</div>
          ${sel(`eh${hi}_ms${mi}_t`,'Tipo Muestra',m.t,OPTS_TM)}
          ${inp(`eh${hi}_ms${mi}_co`,'Cota Muestra (m)',m.co)}
          ${sel(`eh${hi}_ms${mi}_e`,'Ensayo',m.e,OPTS_ENS)}
        </div>`).join('')}
    </div>`).join('');
}

async function guardarEdicion() {
  if (!calEditando) return;
  const cal = calEditando;
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  // Recopilar datos generales actualizados
  const payload = {
    accion: 'editar',
    calicataUID: cal.uid,
    proyecto: proyectoActual.nombre,
    codProy: proyectoActual.cod,
    ot: proyectoActual.ot,
    idCalicata: cal.id,
    fecha: document.getElementById('ed-fecha').value,
    profTotal: document.getElementById('ed-pt').value,
    condMeteo: document.getElementById('ed-met').value,
    nivelFreatico: document.getElementById('ed-nf').value,
    nfObs: document.getElementById('ed-nfobs').value,
    latitud: cal.lat,
    longitud: cal.lng,
    utmE: cal.utme,
    utmN: cal.utmn,
    utmZona: cal.zona,
    obsGenerales: document.getElementById('ed-obs').value,
    horizontes: cal.hs.map((h, hi) => {
      const g = id => (document.getElementById(`eh${hi}_${id}`) || {}).value || '';
      const ms = (h.ms||[]).map((m,mi) => ({
        t: (document.getElementById(`eh${hi}_ms${mi}_t`)||{}).value||'',
        co: (document.getElementById(`eh${hi}_ms${mi}_co`)||{}).value||'',
        e: (document.getElementById(`eh${hi}_ms${mi}_e`)||{}).value||''
      }));
      return {
        nEstrato: h.n,
        profInicio: g('ini'),
        profFin: g('fin'),
        pctBolones: g('pBol'),
        tmaxBolones: g('tBol'),
        pctGravas: g('pG'),
        pctArenas: g('pA'),
        pctFinos: g('pF'),
        tmaxParticulas: g('tP'),
        tPredominante: g('tPr'),
        graduacion: g('gq'),
        sucs: g('us'),
        nombreSuelo: g('ns') || UM[g('us')] || '',
        nombreLocal: g('nl'),
        colorPrincipal: g('cP'),
        colorSecundario: g('cS'),
        manchas: g('ma'),
        olor: g('ol'),
        dilatancia: g('di'),
        resistenciaSeca: g('rs'),
        plasticidad: g('pl'),
        formaParticulas: g('fo'),
        humedad: g('hu'),
        compacidad: g('co'),
        consistencia: g('cn'),
        estructura: g('st'),
        cementacion: g('ce'),
        origen: g('or'),
        materiaOrganica: g('mo'),
        tipoMuestra: ms.map(m=>m.t).join(' | '),
        cotaMuestra: ms.map(m=>m.co).join(' | '),
        ensayo: ms.map(m=>m.e).join(' | '),
        obsEstrato: g('obs')
      };
    })
  };

  try {
    const resp = await fetch(SU, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const json = await resp.json();
    if (json.status === 'ok') {
      // Actualizar datos en memoria
      cal.fecha = payload.fecha;
      cal.pt = payload.profTotal;
      cal.met = payload.condMeteo;
      cal.nf = payload.nivelFreatico;
      cal.nfobs = payload.nfObs;
      cal.obs = payload.obsGenerales;
      payload.horizontes.forEach(ph => {
        const hm = cal.hs.find(h => h.n === ph.nEstrato);
        if (hm) {
          hm.ini = ph.profInicio; hm.fin = ph.profFin;
          hm.pBol = ph.pctBolones; hm.tBol = ph.tmaxBolones;
          hm.pG = ph.pctGravas; hm.pA = ph.pctArenas; hm.pF = ph.pctFinos;
          hm.tP = ph.tmaxParticulas; hm.tPr = ph.tPredominante; hm.gq = ph.graduacion;
          hm.us = ph.sucs; hm.ns = ph.nombreSuelo; hm.nl = ph.nombreLocal;
          hm.cP = ph.colorPrincipal; hm.cS = ph.colorSecundario; hm.ma = ph.manchas;
          hm.ol = ph.olor; hm.di = ph.dilatancia; hm.rs = ph.resistenciaSeca;
          hm.pl = ph.plasticidad; hm.fo = ph.formaParticulas; hm.hu = ph.humedad;
          hm.co = ph.compacidad; hm.cn = ph.consistencia; hm.st = ph.estructura;
          hm.ce = ph.cementacion; hm.or = ph.origen; hm.mo = ph.materiaOrganica;
          hm.obs = ph.obsEstrato;
        }
      });
      cerrarModal();
      renderCalicatas();
      toast('✅ Calicata guardada en el Sheet','ok');
    } else {
      throw new Error(json.message || 'Error desconocido');
    }
  } catch(e) {
    toast('⚠ Error al guardar: '+e.message,'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Guardar en Sheet';
  }
}

// Cargar al inicio
cargarDatos();
